name: Mac App Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Version (e.g. 0.1.2)'
        required: true
        default: '0.1.2'

jobs:
  build-mas:
    name: Build & Package Mac App Store .pkg
    runs-on: macos-14

    env:
      BUNDLE_ID: com.berryuiki.omera
      APP_NAME: Omera

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Setup Keychain & Import MAS Certificates ─────────────────────────────
      - name: Import Apple Certificates into Keychain
        env:
          MAS_APP_CERT_BASE64: ${{ secrets.MAS_APP_CERT_BASE64 }}
          MAS_APP_CERT_PASSWORD: ${{ secrets.MAS_APP_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_BASE64: ${{ secrets.MAS_INSTALLER_CERT_BASE64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-build-pwd' }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/mas-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 1. Mac App Distribution certificate
          APP_CERT_PATH="$RUNNER_TEMP/mas-app.p12"
          printf '%s' "$MAS_APP_CERT_BASE64" | /usr/bin/base64 -D > "$APP_CERT_PATH"
          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAS_APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild

          # 2. Mac Installer Distribution certificate
          INSTALLER_CERT_PATH="$RUNNER_TEMP/mas-installer.p12"
          printf '%s' "$MAS_INSTALLER_CERT_BASE64" | /usr/bin/base64 -D > "$INSTALLER_CERT_PATH"
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild

          # Set partition list to avoid GUI authorization prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[ \t]*//' | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Certificates imported successfully."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # ── Install Provisioning Profile ─────────────────────────────────────────
      - name: Install Provisioning Profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          PROFILE_PATH="$RUNNER_TEMP/embedded.provisionprofile"
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"

          # Extract UUID
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
          echo "Installed provisioning profile with UUID: $UUID"

      # ── Build Tauri App Bundle ───────────────────────────────────────────────
      - name: Build Tauri App Bundle
        run: |
          pnpm tauri build --bundles app --target universal-apple-darwin

      # ── Codesign .app with App Sandbox Entitlements & Package .pkg ───────────
      - name: Sign App and Build MAS Installer Package
        env:
          MAS_APP_IDENTITY: ${{ vars.MAS_APP_IDENTITY }}
          MAS_INSTALLER_IDENTITY: ${{ vars.MAS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_dirs=(
            "target/universal-apple-darwin/release/bundle/macos/"*.app
            "target/aarch64-apple-darwin/release/bundle/macos/"*.app
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/"*.app
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/"*.app
          )
          if (( ${#app_dirs[@]} == 0 )); then
            echo "::error::Could not locate built .app bundle"
            exit 1
          fi
          APP_DIR="${app_dirs[0]}"
          echo "Found app bundle at: $APP_DIR"
          ENTITLEMENTS="src-tauri/Entitlements.plist"
          PKG_OUT="$RUNNER_TEMP/Omera-${{ inputs.version }}.pkg"

          # Re-unlock keychain before signing
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          # Embed provisioning profile inside .app bundle
          cp "$RUNNER_TEMP/embedded.provisionprofile" "$APP_DIR/Contents/embedded.provisionprofile"

          if [[ -d "$APP_DIR/Contents/Frameworks" ]]; then
            echo "Signing frameworks and dylibs..."
            find "$APP_DIR/Contents/Frameworks" -type f 2>/dev/null | while read -r lib; do
              codesign --force --timestamp --options runtime --keychain "$KEYCHAIN_PATH" --sign "$MAS_APP_IDENTITY" "$lib" || true
            done
          fi

          echo "Signing application bundle with App Sandbox entitlements..."
          codesign --force --timestamp --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MAS_APP_IDENTITY" \
            "$APP_DIR"

          echo "Verifying application bundle signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          echo "Building Mac App Store installer package with productbuild..."
          productbuild \
            --component "$APP_DIR" /Applications \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MAS_INSTALLER_IDENTITY" \
            "$PKG_OUT"

          echo "Package built at $PKG_OUT"
          echo "PKG_PATH=$PKG_OUT" >> "$GITHUB_ENV"

      # ── Upload Artifact for Local Inspection / Backup ────────────────────────
      - name: Upload .pkg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omera-MAS-Package
          path: ${{ env.PKG_PATH }}
          retention-days: 14

      # ── Upload to App Store Connect via xcrun altool / notarytool ───────────
      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_ISSUER:-}" || -z "${APPLE_API_KEY_CONTENT:-}" ]]; then
            echo "App Store Connect API credentials not provided or incomplete. Skipping upload."
            exit 0
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_API_KEY_CONTENT" | /usr/bin/base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "Uploading package to App Store Connect..."
          xcrun altool --upload-app \
            --file "$PKG_PATH" \
            --type osx \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER" \
            --show-progress
