<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="ringCyan" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12b5cb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ringAmber" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fab82b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Cyan Arc -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ringCyan)" stroke-width="36" stroke-dasharray="520 280" stroke-linecap="round" />
    <!-- Amber Arc -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ringAmber)" stroke-width="36" stroke-dasharray="280 520" stroke-linecap="round" transform="rotate(180)" />
    
    <!-- Berry Satellites -->
    <circle cx="64" cy="-124" r="32" fill="url(#ringAmber)" />
    <circle cx="-64" cy="124" r="32" fill="url(#ringCyan)" />
  </g>
</svg>
