[package]
name = "omera-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Folder scanning and indexing orchestration for Omera"

[dependencies]
omera-domain = { path = "../omera-domain" }
omera-metadata = { path = "../omera-metadata" }
omera-storage = { path = "../omera-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
rayon = "1.10"
tempfile = "3"
trash = "5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }


[[bench]]
name = "large_library"
harness = false

[[bench]]
name = "directory_fingerprint"
harness = false
