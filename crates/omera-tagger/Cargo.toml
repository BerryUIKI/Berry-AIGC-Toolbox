[package]
name = "omera-tagger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local WD14 / Danbooru tagger ONNX inference and auto-tagging for Omera"

[dependencies]
omera-domain = { path = "../omera-domain" }
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
